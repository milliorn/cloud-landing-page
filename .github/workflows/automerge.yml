name: Dependabot reviewer

# Fires whenever Dependabot opens, updates, or reopens a PR targeting main.
# This workflow only approves or closes — it never merges. The actual merge
# happens in dependabot-merge.yml, triggered after Merge Gatekeeper concludes.
# Two reasons it's split out that way instead of merging here:
#
# 1. Deadlock: Merge Gatekeeper waits for every other check on the commit,
#    including this workflow's own "review-dependabot-pr" job, before it can
#    report success. If this job blocked waiting for Merge Gatekeeper (e.g. via
#    `gh pr checks --watch`), neither would ever finish.
# 2. Merges must authenticate as DEPENDABOT_REBASE_PAT (a PAT), not the default
#    GITHUB_TOKEN — GitHub Actions never lets an event produced by GITHUB_TOKEN
#    trigger another workflow run (anti-recursion protection), so a merge done
#    with GITHUB_TOKEN can never fire dependabot-rebase-cascade.yml's
#    pull_request_target:closed trigger, and stale sibling PRs never get
#    rebased. A PAT-authenticated merge is a normal event and triggers it
#    correctly. (Approving here still uses the PAT for the same reason, even
#    though only the merge step's identity actually matters for the cascade.)
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: ["main"]

# One run per PR at a time. We let the current run finish so an in-progress
# squash merge isn't interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Read-only for GITHUB_TOKEN: it's only used by fetch-metadata now. The gh CLI
# calls below authenticate as GH_TOKEN (the DEPENDABOT_REBASE_PAT) instead.
permissions:
  pull-requests: read
  contents: read

env:
  # Opt into Node.js 24 now ahead of the June 2, 2026 forced migration.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review-dependabot-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip entirely if this PR wasn't opened by Dependabot.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      # PAT, not GITHUB_TOKEN — see comment at the top of this file for why.
      GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_PAT }}

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      # Decide once: allow github_actions (any semver) or patch/minor updates;
      # deny everything else. Major updates are filtered upstream by dependabot.yml,
      # so deny is a safety net for anything unexpected that slips through.
      - name: Decide
        id: decision
        run: |
          ecosystem="${{ steps.metadata.outputs.package-ecosystem }}"
          update_type="${{ steps.metadata.outputs.update-type }}"
          if [[ "$ecosystem" == "github_actions" ]] || \
             [[ "$update_type" == "version-update:semver-patch" ]] || \
             [[ "$update_type" == "version-update:semver-minor" ]]; then
            echo "action=allow" >> "$GITHUB_OUTPUT"
          else
            echo "action=deny" >> "$GITHUB_OUTPUT"
          fi

      # Approve only. dependabot-merge.yml does the actual merge once Merge
      # Gatekeeper concludes success — see the note at the top of this file.
      - name: Allow — approve
        if: steps.decision.outputs.action == 'allow'
        run: |
          gh pr review "$PR_URL" --approve -b "Auto-approved: **${{ steps.metadata.outputs.update-type }}** ${{ steps.metadata.outputs.package-ecosystem }} update."

      - name: Deny — unexpected update
        if: steps.decision.outputs.action == 'deny'
        run: |
          gh pr close "$PR_URL" --comment "Auto-closed: ecosystem \`${{ steps.metadata.outputs.package-ecosystem }}\` / update-type \`${{ steps.metadata.outputs.update-type }}\` did not match any allow-list rule. Check dependabot.yml if this is unexpected."
