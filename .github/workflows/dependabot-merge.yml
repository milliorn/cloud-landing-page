name: Dependabot merge

# Fires after Merge Gatekeeper concludes on any PR. Merge Gatekeeper aggregates
# every other required check on the commit, so by the time it reports success
# we know the PR is actually mergeable — no need to re-poll checks here.
#
# This is deliberately a separate workflow from automerge.yml's approve step:
# Merge Gatekeeper waits on that job as one of its own checks, so merging from
# within it would deadlock (see the note at the top of automerge.yml).
on:
  workflow_run:
    workflows: ["Merge Gatekeeper"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # PAT, not GITHUB_TOKEN — see automerge.yml for why the merge event's
      # identity has to be a PAT for dependabot-rebase-cascade.yml to fire.
      GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_PAT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Read the PR number straight off the triggering event instead of
      # looking it up via the commits/{sha}/pulls API — that endpoint lags
      # behind the push by a few seconds and can return nothing yet, which
      # would make this step silently skip a PR that's actually ready.
      - name: Find the PR for this run
        id: pr
        env:
          WORKFLOW_RUN_JSON: ${{ toJson(github.event.workflow_run) }}
        run: |
          number=$(jq -r '.pull_requests[0].number // empty' <<<"$WORKFLOW_RUN_JSON")
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Only merge PRs the "Dependabot reviewer" workflow already approved —
      # that approval is our signal the allow-list decision was "allow". A PR
      # that isn't cleanly mergeable yet (e.g. behind main) is a normal,
      # expected state — skip it quietly rather than failing the run; it'll
      # be picked up again the next time Merge Gatekeeper succeeds for it.
      - name: Merge if Dependabot-authored, approved, and up to date
        if: steps.pr.outputs.number != ''
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          info=$(gh pr view "$NUMBER" --json state,author,mergeable,mergeStateStatus,reviews)
          state=$(jq -r '.state' <<<"$info")
          author=$(jq -r '.author.login' <<<"$info")
          mergeable=$(jq -r '.mergeable' <<<"$info")
          merge_state=$(jq -r '.mergeStateStatus' <<<"$info")
          approvals=$(jq '[.reviews[] | select(.state == "APPROVED")] | length' <<<"$info")

          if [[ "$state" != "OPEN" || "$author" != "dependabot[bot]" ]]; then
            echo "PR #$NUMBER is not an open Dependabot PR (author=$author state=$state) — skipping."
          elif [[ "$approvals" -eq 0 ]]; then
            echo "PR #$NUMBER has no approval from the reviewer workflow — skipping."
          elif [[ "$mergeable" != "MERGEABLE" || "$merge_state" != "CLEAN" ]]; then
            echo "PR #$NUMBER isn't cleanly mergeable yet (mergeable=$mergeable, mergeStateStatus=$merge_state) — skipping."
          else
            # `gh pr merge` (with or without --auto) always drives the merge
            # through the `mergePullRequest` GraphQL mutation, which fine-grained
            # PATs cannot access at all ("Resource not accessible by personal
            # access token"), independent of the token's configured scopes. The
            # REST merge endpoint works fine with the same PAT, so call it
            # directly instead of going through `gh pr merge`.
            gh api --method PUT "repos/${{ github.repository }}/pulls/$NUMBER/merge" -f merge_method=squash
          fi
